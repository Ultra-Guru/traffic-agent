# traffic-agent detekt configuration.
# Extends the default ruleset (buildUponDefaultConfig = true) and only
# tunes the thresholds that matter for this codebase.

build:
  maxIssues: 0

complexity:
  LongMethod:
    threshold: 120
  LongParameterList:
    functionThreshold: 9
    constructorThreshold: 12
    ignoreDefaultParameters: true
  TooManyFunctions:
    active: false
  CyclomaticComplexMethod:
    threshold: 18
  NestedBlockDepth:
    threshold: 6
  LargeClass:
    threshold: 900

style:
  MagicNumber:
    active: false
  ReturnCount:
    active: false
  MaxLineLength:
    maxLineLength: 140
  UnusedPrivateMember:
    ignoreAnnotated: ["Preview"]

naming:
  FunctionNaming:
    ignoreAnnotated: ["Composable"]
  TopLevelPropertyNaming:
    constantPattern: "[A-Za-z][A-Za-z0-9]*|[A-Z][A-Z0-9_]*"
  MatchingDeclarationName:
    active: false

exceptions:
  TooGenericExceptionCaught:
    active: false
  SwallowedException:
    active: false
