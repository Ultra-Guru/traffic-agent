name: mutation-verification

# 变异验证（对应五个任务看板 TB1-TB5）：
# 每次推送到 main 或手动触发时，五个看板对应的模块并行运行 mutmut，
# 输出各板 mutation score 并在低于阈值时失败。
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  mutmut:
    name: ${{ matrix.board }} · ${{ matrix.modules }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - board: TB1
            modules: traffic_agent/session.py,traffic_agent/events.py,traffic_agent/capture
          - board: TB2
            modules: traffic_agent/transform
          - board: TB3
            modules: traffic_agent/analysis
          - board: TB4
            modules: traffic_agent/agent
          - board: TB5
            modules: traffic_agent/export
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Sanity unit tests
        run: python -m pytest -q --tb=short
      - name: Mutation verification
        run: |
          python scripts/mutation_score.py \
            --board "${{ matrix.board }}" \
            --paths "${{ matrix.modules }}" \
            --min-score 55
      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report-${{ matrix.board }}
          path: mutation-${{ matrix.board }}.json
          if-no-files-found: ignore
