[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "traffic-agent"
version = "2.0.0"
description = "Traffic Agent SPEC v2.0 reference implementation — L1-L5 engine for mobile traffic debugging (HttpCanary/Reqable parity and beyond)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ultra-Guru" }]
keywords = ["traffic", "mitm", "debugger", "capture", "agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
    "Topic :: System :: Networking :: Monitoring",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "mutmut==2.4.5",
]

[tool.setuptools.packages.find]
include = ["traffic_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
